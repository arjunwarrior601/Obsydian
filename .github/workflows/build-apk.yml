name: Build OBSYDIAN Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Read Gradle version
        id: gv
        run: echo "v=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')" >> $GITHUB_OUTPUT

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.v }}

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: obsydian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
